<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильтрация техники</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/table.css">
    <link rel="stylesheet" href="../css/filter.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="header">
        <div class="header-links">
            <a class="link" href="../index.html">Главная</a>
            <a class="link" href="./">Каталог</a>
            <a class="link" href="./page-form.html">Форма</a>
            <a class="link" href="./page-contacts.html">Контакты</a>
        </div>
    </div>


    <div class="filters">
        <div class="filter-group">
            <label for="filterType">Тип техники</label>
            <select id="filterType">
                <option value="">Все типы</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filterRoom">Комната</label>
            <select id="filterRoom">
                <option value="">Все комнаты</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filterSearch">Поиск</label>
            <input id="filterSearch" type="text" placeholder="Учётный номер или наименование">
        </div>

        <div class="filter-actions">
            <button id="resetFilters" type="button" class="btn btn-secondary">Сбросить</button>
        </div>
    </div>

    <div id="resultSummary" class="result-summary"></div>

    <div class="app">
        <div class="table-wrapper">
            <table id="filteredTable" class="table">
                <thead>
                    <tr>
                        <th>Номер</th>
                        <th>Учётный номер</th>
                        <th>Наименование</th>
                        <th>Тип</th>
                        <th>Комната</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/filter.js"></script>
</body>

</html>
