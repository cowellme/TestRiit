<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма — добавление техники</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/table.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="header">
        <div class="header-links">
            <a class="link" href="../index.html">Главная</a>
            <a class="link" href="./page-catalog.html">Каталог</a>
            <a class="link" href="./page-form.html">Форма</a>
            <a class="link" href="./page-contacts.html">Контакты</a>
        </div>
    </div>

    <div class="app-form">
        <form id="technicForm" class="form-card">
            <h2 class="table-header">Добавление техники</h2>

            <div class="form-grid">
                <div class="form-group">
                    <label for="formAccount">Учётный номер</label>
                    <input id="formAccount" type="text" maxlength="32" placeholder="Только цифры и латинские буквы">
                </div>

                <div class="form-group">
                    <label for="formName">Наименование</label>
                    <input id="formName" type="text" maxlength="256" placeholder="Например: ПК офисный №3">
                </div>

                <div class="form-group">
                    <label for="formType">Тип техники</label>
                    <select id="formType"></select>
                </div>

                <div class="form-group">
                    <label for="formRoom">Комната</label>
                    <input id="formRoom" type="number" min="1" max="1000" placeholder="1–1000">
                </div>
            </div>

            <div class="form-actions">
                <button id="addTechnic" type="button" class="btn btn-primary">Добавить</button>
                <button id="resetForm" type="button" class="btn btn-secondary">Очистить</button>
            </div>
        </form>

        <div class="table-wrapper">
            <table id="formTable" class="table">
                <thead>
                    <tr>
                        <th>Номер</th>
                        <th>Учётный номер</th>
                        <th>Наименование</th>
                        <th>Тип</th>
                        <th>Комната</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/form.js"></script>
</body>

</html>
